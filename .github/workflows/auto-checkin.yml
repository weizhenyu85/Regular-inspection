name: Router 自动签到

on:
  # 定时执行 - 每6小时执行一次
  schedule:
    - cron: '0 */6 * * *'

  # 手动触发
  workflow_dispatch:
    inputs:
      manual_run:
        description: '手动触发签到'
        required: false
        default: 'true'

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write  # 允许提交和推送更改

    # 将账号拆分到多个并行任务，每个任务运行在独立的 runner（不同出口 IP），
    # 规避目标平台按 IP 的签到数量限制（同一 IP 超过阈值后返回 403）。
    # - 数字分组（0/1/2）：AnyRouter 账号按顺序连续切块（如 14 个 -> 5/5/4），
    #   分组数需与下方 ACCOUNT_GROUP_COUNT 保持一致
    # - agentrouter 分组：AgentRouter 账号独立一组（登录即签到，无同 IP 风控）
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, agentrouter]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 获取 Playwright 版本
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version: $PLAYWRIGHT_VERSION"

      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 安装 Playwright 浏览器
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 设置 Clash 代理（可选）
        env:
          # agentrouter 组只认专用订阅 AGENTROUTER_PROXY_SUBSCRIPTION_URL（不回退全局，
          # 与下方签到步骤 USE_PROXY/PROXY_SERVER 的判定条件保持一致）；
          # 其它组用全局订阅 PROXY_SUBSCRIPTION_URL（未配置则该组跳过代理）
          SUBSCRIPTION_URL: ${{ matrix.group == 'agentrouter' && secrets.AGENTROUTER_PROXY_SUBSCRIPTION_URL || (matrix.group != 'agentrouter' && secrets.PROXY_SUBSCRIPTION_URL) || '' }}
          # agentrouter 组只选匹配的节点（默认新加坡，可用 secret 覆盖）：
          # 部分节点连不上 AgentRouter，固定用与本地一致的新加坡节点更稳
          NODE_FILTER: ${{ matrix.group == 'agentrouter' && (secrets.AGENTROUTER_PROXY_NODE_FILTER || '(?i)(新加坡|singapore|sg|狮城)') || '' }}
        run: |
          # 检查是否配置了代理订阅
          if [ -z "$SUBSCRIPTION_URL" ]; then
            echo "⚠️ 未配置代理订阅，跳过 Clash 代理设置"
            exit 0
          fi

          echo "=== 📡 开始配置 Clash 代理 ==="

          # 下载 Clash.Meta (mihomo)
          echo "📥 下载 Clash.Meta..."
          wget -q -O clash.gz "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-linux-amd64-v1.18.10.gz"
          gunzip clash.gz
          chmod +x clash

          # 生成 Clash 配置文件
          echo "📝 生成 Clash 配置..."
          # 节点过滤（agentrouter 组）：只用匹配的节点（如新加坡），组类型用 select，
          # 便于通过 API 逐个切换节点、找到未被 CDN 滑块拦截的 IP；
          # 无过滤的组保持 url-test 按延迟自动选点
          if [ -n "$NODE_FILTER" ]; then
            echo "🔎 节点过滤: $NODE_FILTER"
            GROUP_TYPE="select"
            FILTER_LINE="    filter: \"${NODE_FILTER}\""
          else
            GROUP_TYPE="url-test"
            FILTER_LINE=""
          fi
          cat > config.yaml << EOF
          mixed-port: 7890
          allow-lan: false
          mode: rule
          log-level: info
          external-controller: 127.0.0.1:9090

          proxy-providers:
            my-provider:
              type: http
              url: ${SUBSCRIPTION_URL}
              interval: 3600
              path: ./subscription.yaml
              health-check:
                enable: true
                interval: 300
                url: http://www.gstatic.com/generate_204

          proxies: []

          proxy-groups:
            - name: PROXY
              type: ${GROUP_TYPE}
              use:
                - my-provider
          ${FILTER_LINE}
              url: http://www.gstatic.com/generate_204
              interval: 300

          rules:
            - MATCH,PROXY
          EOF

          echo "=== 生成的 config.yaml ==="
          cat config.yaml
          echo "========================="

          # 生成节点扫描脚本：在 select 组内逐个切换节点，实测 AgentRouter 是否可达。
          # 被 CDN 按 IP 拦截时返回滑块 HTML；正常时 /api/status 返回 JSON（含 "success"）。
          # url-test 组（非 agentrouter）会自动跳过；签到步骤开跑前也会调用做校验。
          cat > pick_node.sh << 'PICKEOF'
          #!/bin/bash
          API="http://127.0.0.1:9090"
          PROXY="http://127.0.0.1:7890"
          GROUP="PROXY"

          TYPE=$(curl -s -m 5 "$API/proxies/$GROUP" | jq -r '.type' 2>/dev/null)
          if [ "$TYPE" != "Selector" ]; then
            exit 0
          fi

          test_node() {
            for u in "https://agentrouter.org/api/status" "https://ps.air-outer.com/api/status"; do
              if curl -x "$PROXY" -s -m 8 "$u" | head -c 300 | grep -q '"success"'; then
                return 0
              fi
            done
            return 1
          }

          NOW=$(curl -s -m 5 "$API/proxies/$GROUP" | jq -r '.now')
          echo "🔎 验证当前节点能否访问 AgentRouter: $NOW"
          if test_node; then
            echo "✅ 当前节点可用: $NOW"
            exit 0
          fi
          echo "⚠️ 当前节点被滑块拦截，逐个扫描其它节点..."

          mapfile -t NODES < <(curl -s -m 5 "$API/proxies/$GROUP" | jq -r '.all[]')
          COUNT=0
          for NODE in "${NODES[@]}"; do
            [ "$NODE" = "$NOW" ] && continue
            COUNT=$((COUNT+1))
            [ "$COUNT" -gt 20 ] && break
            curl -s -m 5 -X PUT "$API/proxies/$GROUP" -d "$(jq -cn --arg n "$NODE" '{name:$n}')" > /dev/null
            sleep 1
            if test_node; then
              echo "✅ 已切换到可用节点: $NODE"
              exit 0
            fi
            echo "  ✗ 被拦截: $NODE"
          done
          echo "❌ 扫描了 $COUNT 个节点均被拦截，保持当前节点继续"
          exit 0
          PICKEOF
          chmod +x pick_node.sh

          # 启动 Clash（后台运行）
          # 用 setsid + </dev/null 让 Clash 脱离当前 step 的 shell 与控制终端，
          # 避免 step 结束 shell 退出时 Clash 收到 SIGHUP 被杀（导致下个 step 7890 失联）
          echo "🚀 启动 Clash..."
          setsid ./clash -f config.yaml > clash.log 2>&1 < /dev/null &
          CLASH_PID=$!
          echo "Clash PID: $CLASH_PID"

          # 等待外部控制器就绪（Clash 启动 + 拉订阅需要时间）
          echo "⏳ 等待 Clash 控制器就绪..."
          for i in $(seq 1 12); do
            sleep 5
            if curl -s -m 3 "http://127.0.0.1:9090/version" > /dev/null 2>&1; then
              echo "✅ 控制器已就绪（约 $((i*5)) 秒）"
              break
            fi
          done

          # 等待订阅节点加载进 PROXY 组
          NODE_COUNT=0
          for i in $(seq 1 12); do
            NODE_COUNT=$(curl -s -m 5 "http://127.0.0.1:9090/proxies/PROXY" | jq -r '.all | length' 2>/dev/null || echo 0)
            if [ "${NODE_COUNT:-0}" -gt 0 ]; then break; fi
            sleep 5
          done
          echo "📦 PROXY 组节点数: ${NODE_COUNT:-0}"
          if [ "${NODE_COUNT:-0}" = "0" ]; then
            echo "⚠️ 订阅未加载到任何节点（可能被节点过滤筛空或订阅拉取失败），Clash 日志尾部："
            tail -n 40 clash.log || true
          fi

          # agentrouter（select 组）：逐个节点实测 AgentRouter 可达性，跳过被滑块拦截的 IP
          ./pick_node.sh || true

          # 最终连通性确认
          READY=0
          for i in $(seq 1 6); do
            CODE=$(curl -x http://127.0.0.1:7890 -s -m 8 -o /dev/null -w "%{http_code}" http://www.gstatic.com/generate_204 || echo 000)
            echo "  连通性探测 ${i}: HTTP ${CODE}"
            if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
              READY=1
              echo "✅ Clash 代理已就绪"
              break
            fi
            sleep 5
          done
          if [ "$READY" != "1" ]; then
            echo "⚠️ 代理仍未就绪，打印 Clash 日志尾部用于诊断："
            tail -n 40 clash.log || true
            echo "（继续执行，签到会回退直连）"
          fi

      - name: 执行签到
        env:
          # 账号配置
          ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
          AGENTROUTER_ACCOUNTS: ${{ secrets.AGENTROUTER_ACCOUNTS }}
          # agentrouter 组走海外新加坡节点，使用原域名 agentrouter.org（海外可达）；
          # 其它组留空，由代码默认使用备用域名 ps.air-outer.com
          AGENTROUTER_BASE_URL: ${{ matrix.group == 'agentrouter' && 'https://agentrouter.org' || '' }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          PROVIDERS: ${{ secrets.PROVIDERS }}

          # 通知配置
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}

          # 代理配置（使用本地 Clash 提供的 HTTP 代理）
          # agentrouter 组用专用订阅、其它组用全局订阅；仅当对应订阅已配置时才启用
          USE_PROXY: ${{ (matrix.group == 'agentrouter' && secrets.AGENTROUTER_PROXY_SUBSCRIPTION_URL != '') || (matrix.group != 'agentrouter' && secrets.PROXY_SUBSCRIPTION_URL != '') }}
          PROXY_SERVER: ${{ ((matrix.group == 'agentrouter' && secrets.AGENTROUTER_PROXY_SUBSCRIPTION_URL != '') || (matrix.group != 'agentrouter' && secrets.PROXY_SUBSCRIPTION_URL != '')) && 'http://127.0.0.1:7890' || '' }}

          # 代理细粒度控制（可选）
          PROXY_METHODS: ${{ secrets.PROXY_METHODS }}
          NO_PROXY_METHODS: ${{ secrets.NO_PROXY_METHODS }}

          # CI 环境优化
          CI_DISABLED_AUTH_METHODS: ${{ secrets.CI_DISABLED_AUTH_METHODS }}
          SESSION_CACHE_KEY: ${{ secrets.SESSION_CACHE_KEY }}

          # 账号分组（多 IP 分批签到，规避同 IP 风控）
          # ACCOUNT_GROUP_COUNT 必须与上方 matrix.group 中数字分组的数量一致
          # （agentrouter 为命名独立分组，不计入数字分组数）
          ACCOUNT_GROUP: ${{ matrix.group }}
          ACCOUNT_GROUP_COUNT: '3'
        run: |
          # 确保代理在线：GitHub Actions 后台进程可能在上个 step 结束时被回收，
          # 若本组启用了 Clash 代理（config.yaml 存在）而 7890 已失联，就地重启
          if [ -f config.yaml ] && [ -x ./clash ]; then
            CODE=$(curl -x http://127.0.0.1:7890 -s -m 8 -o /dev/null -w "%{http_code}" http://www.gstatic.com/generate_204 || echo 000)
            if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
              echo "✅ 代理仍在线（HTTP $CODE）"
            else
              echo "⚠️ 代理已失联（HTTP $CODE），重启 Clash..."
              setsid ./clash -f config.yaml > clash.log 2>&1 < /dev/null &
              echo "⏳ 等待代理就绪（最多 90 秒）..."
              for i in $(seq 1 18); do
                sleep 5
                CODE=$(curl -x http://127.0.0.1:7890 -s -m 8 -o /dev/null -w "%{http_code}" http://www.gstatic.com/generate_204 || echo 000)
                echo "  第 ${i} 次探测（$((i*5))s）: HTTP ${CODE}"
                if [ "$CODE" = "204" ] || [ "$CODE" = "200" ]; then
                  echo "✅ 代理已就绪（约 $((i*5)) 秒）"
                  break
                fi
              done
              if [ "$CODE" != "204" ] && [ "$CODE" != "200" ]; then
                echo "⚠️ 代理重启后仍未就绪，打印 Clash 日志尾部："
                tail -n 40 clash.log || true
              fi
            fi
            # 开跑前校验：当前节点若被 CDN 滑块拦截则自动切换（仅 select 组生效，
            # 覆盖「代理在线但节点 IP 被 Aliyun 标记」的场景）
            if [ -x ./pick_node.sh ]; then
              ./pick_node.sh || true
            fi
          fi
          python main.py

      - name: 提交余额数据
        if: always()
        env:
          GROUP: ${{ matrix.group }}
        run: |
          DATA_FILE="balance_data_g${GROUP}.json"
          HASH_FILE="balance_hash_g${GROUP}.txt"

          echo "=== 检查余额数据文件 ==="
          ls -lh "$DATA_FILE" "$HASH_FILE" || echo "文件不存在"

          echo "=== 配置 Git ==="
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          echo "=== 添加文件到暂存区 ==="
          git add "$DATA_FILE" "$HASH_FILE" 2>/dev/null || echo "添加文件失败（可能文件不存在）"

          if git diff --staged --quiet; then
            echo "⚠️ 没有需要提交的更改"
            exit 0
          fi

          git commit -m "自动更新余额数据 group ${GROUP} [skip ci]"

          # 多个并行分组任务会同时向 main 推送，直接 push 会因 non-fast-forward 失败。
          # 各分组写入独立文件（balance_*_gN），rebase 不会产生内容冲突，重试即可成功。
          echo "=== 推送到远程（rebase + 重试）==="
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ 余额数据已提交并推送（group ${GROUP}）"
              exit 0
            fi
            echo "⚠️ 第 $i 次推送失败，随机等待后重试..."
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "❌ 多次推送仍失败（不影响签到结果）"
          exit 0

      - name: 上传余额记录（备份）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-data-${{ github.run_number }}-g${{ matrix.group }}
          path: |
            balance_hash_g${{ matrix.group }}.txt
            balance_data_g${{ matrix.group }}.json
            checkin_result_g${{ matrix.group }}.json
          retention-days: 7

      # 上传本组签到结果，供汇总任务合并成单条通知
      - name: 上传分组结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkin-result-g${{ matrix.group }}
          path: checkin_result_g${{ matrix.group }}.json
          if-no-files-found: warn
          retention-days: 1

  # 汇总各分组结果，合并后发送单条通知
  notify:
    runs-on: ubuntu-latest
    needs: checkin
    if: always()
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "httpx[http2]>=0.25.0" "python-dotenv>=1.0.0"

      - name: 下载所有分组结果
        uses: actions/download-artifact@v4
        with:
          pattern: checkin-result-g*
          path: group_results
          merge-multiple: true

      - name: 发送合并通知
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CUSTOM_SMTP_SERVER: ${{ secrets.CUSTOM_SMTP_SERVER }}
          DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        run: |
          python summary_notify.py group_results
